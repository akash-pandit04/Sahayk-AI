services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sahayak_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sahayak_db}
      POSTGRES_USER: ${POSTGRES_USER:-sahayak_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahayak_admin} -d ${POSTGRES_DB:-sahayak_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahayak_api
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-sahayak_admin}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-sahayak_db}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: sahayak_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
